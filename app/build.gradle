plugins {
    id "com.android.application"
}

android {
    namespace "dev.openkeyboard.applelayout"
    compileSdk 35
    ndkVersion "28.0.13004108"

    defaultConfig {
        applicationId "dev.openkeyboard.applelayout"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DPYTHON_EXECUTABLE=/usr/bin/python3"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "net.jqwik:jqwik:1.9.0"
    // Gradle 9+ requires the JUnit Platform launcher on the test runtime classpath
    // so the test executor can bootstrap useJUnitPlatform().
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

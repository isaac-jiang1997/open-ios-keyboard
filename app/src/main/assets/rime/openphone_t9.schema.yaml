# Rime schema
# encoding: utf-8

schema:
  schema_id: openphone_t9
  name: OpenPhone 九宫格拼音
  version: "1.0"

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - options:
      - zh_hant
      - zh_hans
    reset: 1
    states: [繁體, 简体]
  - name: ascii_punct
    reset: 0
    states: [。，, ．，]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@zh_hans
    - uniquifier

speller:
  alphabet: "1234567890"
  delimiter: " '"
  algebra:
    - pinyin:/abbreviation
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: rime_ice
  prism: openphone_t9
  enable_sentence: true
  enable_completion: true

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[A-Za-z]+)$"

zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none

__patch:
  - grammar:/hant?
